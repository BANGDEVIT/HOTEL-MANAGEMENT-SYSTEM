name: Web CI

on:
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Web - lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Script build của Vite template là "tsc -b && vite build" -> đã gồm type-check
      - name: Build
        run: npm run build

  docker:
    name: Web - Docker build (không push)
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./front
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
