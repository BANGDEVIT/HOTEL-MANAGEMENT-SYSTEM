server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload ảnh (avatar, ảnh phòng...) tối đa 10MB
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS nội bộ của Docker: container api khởi động lại đổi IP thì nginx vẫn tìm được
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: chuyển nguyên đường dẫn /api/... sang container api (cùng domain -> không cần CORS)
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File build có hash trong tên -> cache 1 năm
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi route FE (/admin/rooms...) trả index.html.
    # index.html không cache để bản deploy mới có hiệu lực ngay.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}