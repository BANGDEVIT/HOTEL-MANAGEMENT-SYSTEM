name: CD

on:
  push:
    branches: [main]
  # Nút "Run workflow" để deploy lại bằng tay
  workflow_dispatch:

# Không cho 2 lần deploy chạy chồng nhau; lần sau chờ lần trước xong
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build image + deploy lên VPS
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tên image trên GHCR bắt buộc chữ thường
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hotel-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag latest để VPS kéo về, tag theo commit SHA để rollback
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/hotel
            docker compose pull api
            # Chạy migration TRƯỚC khi đổi container: migration lỗi thì bản cũ vẫn chạy
            docker compose run --rm api npx prisma migrate deploy
            docker compose up -d api
            docker image prune -f
            sleep 5
            docker compose ps api
