name: API CI

on:
  # Mọi PR vào main/dev đều chạy (không lọc theo thư mục),
  # để branch protection "bắt buộc CI xanh" không bị treo khi PR chỉ sửa FE
  pull_request:
    branches: [main, dev]
  # Cho phép api-cd.yml gọi lại workflow này trước khi deploy
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: API - lint, test, build
    runs-on: ubuntu-latest
    # Repo gồm cả api/ và front/: mọi lệnh run chạy trong thư mục api/
    defaults:
      run:
        working-directory: api
    env:
      # URL giả: prisma.config.ts cần biến tồn tại để generate; CI không kết nối DB thật
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate + validate schema
        run: |
          npx prisma generate
          npx prisma validate

      - name: Lint
        run: npx eslint src

      - name: Unit test
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build

  docker:
    name: API - Docker build (không push)
    # Chỉ chạy ở PR; khi deploy thì api-cd.yml tự build + push
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          # scope tách cache của api và web, không ghi đè nhau
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
